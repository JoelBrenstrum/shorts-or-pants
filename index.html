<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shorts or pants? Today's answer for where you are." />
    <meta name="theme-color" content="#FFD84D" />
    <title>Shorts or Pants</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M4 5h16l1.3 11H14l-2-6.2L10 16H2.7z' fill='%23FFB547' stroke='%231E1B2E' stroke-width='1.5' stroke-linejoin='round'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
    <script>
      try {
        const saved = localStorage.getItem('sop:scheme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.scheme = dark ? 'dark' : 'light'
      } catch {}
    </script>
  </head>
  <body data-theme="neutral">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
